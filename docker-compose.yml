services:
  api:
    image: ghcr.io/bts-io/hookforms:latest
    # To build the image from this folder instead of pulling it, swap the line above for:
    # build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - GMAIL_SENDER_EMAIL=${GMAIL_SENDER_EMAIL:-}
      - EVENT_RETENTION_DAYS=${EVENT_RETENTION_DAYS:-30}
      - DEBUG=${DEBUG:-false}
    volumes:
      - hookforms-data:/data
      - ./config/gmail:/app/config/gmail
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    volumes:
      - ./config/cloudflared:/etc/cloudflared
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  hookforms-data:
